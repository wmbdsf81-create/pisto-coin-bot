<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Miner V2 - Ultimate Edition</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src='//libtl.com/sdk.js' data-zone='10390421' data-sdk='show_10390421'></script>

    <style>
        :root { --gold: #f3ba2f; --dark: #080a0c; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --red: #f42a41; --green: #006a4e; }
        body { background: var(--dark); color: #fff; text-align: center; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; overflow-x: hidden; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #080a0c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader-bar-bg { width: 200px; height: 4px; background: #1a1d23; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .loader-bar-fill { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }

        .header { display: flex; justify-content: space-around; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; }
        .stat-box { background: var(--glass); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 12px; min-width: 90px; }
        .stat-value { color: var(--gold); font-weight: 800; font-size: 13px; }

        .tab-content { display: none; padding: 20px; padding-bottom: 120px; }
        .active-tab { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .main-balance { font-size: 40px; margin: 20px 0; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 42px; height: 42px; border-radius: 50%; margin-right: 12px; border: 2px solid var(--gold); }

        .coin-btn { width: 210px; height: 210px; border-radius: 50%; border: 10px solid #1a1d23; cursor: pointer; transition: 0.1s; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .coin-btn:active { transform: scale(0.92); }

        .bd-text { font-weight: 900; font-size: 16px; margin-top: 15px; }
        .bd-green { color: var(--green); }
        .bd-red { color: var(--red); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .card { background: linear-gradient(145deg, #1a0000, #080a0c); border: 1px solid var(--glass-border); padding: 12px; border-radius: 15px; text-align: left; position: relative; }
        .locked-card { opacity: 0.5; filter: grayscale(1); }
        .buy-btn { background: var(--gold); color: #000; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 8px; font-size: 12px; }

        /* Task & Withdraw Style */
        .task-item { background: var(--glass); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .claim-btn { background: var(--green); color: #fff; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .withdraw-card { background: #111; border: 1px dashed var(--gold); padding: 20px; border-radius: 20px; margin-bottom: 20px; }

        .footer { position: fixed; bottom: 15px; left: 5%; width: 90%; background: rgba(18, 22, 28, 0.98); border: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 12px 0; border-radius: 22px; z-index: 1000; }
        .nav-item { font-size: 11px; color: #666; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--gold); }

        .plus-one { position: absolute; color: var(--gold); font-size: 26px; font-weight: 900; animation: floatUp 0.8s forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-110px); } }
    </style>
</head>
<body>

    <div id="loader">
        <h2 style="color:var(--gold);">PISTO MINER V2</h2>
        <div class="loader-bar-bg"><div id="loader-fill" class="loader-bar-fill"></div></div>
    </div>

    <div class="header">
        <div class="stat-box"><span>PROFIT/HR</span><br><span id="pph-val" class="stat-value">0</span></div>
        <div class="stat-box"><span>ADS</span><br><span id="ads-count" class="stat-value">0</span></div>
    </div>

    <div id="tab-home" class="tab-content active-tab">
        <div class="main-balance"><img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png"><span id="balance">0</span></div>
        <img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png" class="coin-btn" onclick="mine(event)">
        <div class="bd-text"><span style="color:var(--gold)">PISTO</span> <span class="bd-green">POWERED BY</span> <span class="bd-red">BANGLADESH 🇧🇩</span></div>
        <button onclick="watchFixedAd()" style="background:var(--red); color:white; border:none; padding:15px; border-radius:12px; margin-top:20px; width:85%; font-weight:900; cursor:pointer;">📺 WATCH AD (+2K)</button>
    </div>

    <div id="tab-mine" class="tab-content">
        <h3 style="text-align:left; color:var(--gold);">⛏️ MINING RIGS (15)</h3>
        <div id="shop-container" class="grid"></div>
    </div>

    <div id="tab-withdraw" class="tab-content">
        <div class="withdraw-card">
            <h2 style="color:var(--gold); margin:0;">WITHDRAW</h2>
            <p style="color:var(--red); font-weight:bold; font-size:14px;">STATUS: COMING SOON</p>
            <small style="color:#888;">Roadmap: Phase 4 (March 2026)</small>
        </div>

        <h3 style="text-align:left; color:var(--gold);">📋 TASKS</h3>
        <div class="task-item">
            <div><b>Join Channel</b><br><small style="color:var(--gold);">+10,000 Coins</small></div>
            <button id="tg-btn" class="claim-btn" onclick="handleTgTask()">JOIN</button>
        </div>

        <div class="task-item">
            <div><b>Watch Bonus Ad</b><br><small style="color:var(--gold);">+2,000 Coins</small></div>
            <button class="claim-btn" onclick="watchFixedAd()">START</button>
        </div>
    </div>

    <div class="footer">
        <div class="nav-item active" onclick="showTab('tab-home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="showTab('tab-mine', this)">⛏️<br>Mine</div>
        <div class="nav-item" onclick="showTab('tab-withdraw', this)">💰<br>Withdraw</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTpsebnsHvl9RI9hjkA3VnRY9-NX0ESo8",
            authDomain: "pisto-f4f26.firebaseapp.com",
            projectId: "pisto-f4f26",
            storageBucket: "pisto-f4f26.firebasestorage.app",
            messagingSenderId: "345148284758",
            appId: "1:345148284758:web:fc6e1174cb2022842400f7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, nrg = 1000, pph = 0, ads = 0, tgDone = false;
        const uid = (tg.initDataUnsafe.user?.id || "user_pisto").toString();
        const uRef = doc(db, "users", uid);

        // ১৫টি কার্ডের তালিকা
        const nodes = [
            { id: 1, name: "Node 01", price: 10000, profit: 450, ads: 0 },
            { id: 2, name: "Node 02", price: 50000, profit: 2400, ads: 5 },
            { id: 3, name: "Node 03", price: 150000, profit: 8000, ads: 10 },
            { id: 4, name: "Node 04", price: 500000, profit: 28000, ads: 20 },
            { id: 5, name: "Node 05", price: 2000000, profit: 120000, ads: 35 },
            { id: 6, name: "Node 06", price: 10000000, profit: 650000, ads: 55 },
            { id: 7, name: "Node 07", price: 50000000, profit: 3500000, ads: 80 },
            { id: 8, name: "Node 08", price: 200000000, profit: 15000000, ads: 120 },
            { id: 9, name: "Node 09", price: 1000000000, profit: 85000000, ads: 180 },
            { id: 10, name: "Node 10", price: 5000000000, profit: 450000000, ads: 260 },
            { id: 11, name: "Node 11", price: 20000000000, profit: 2000000000, ads: 380 },
            { id: 12, name: "Node 12", price: 80000000000, profit: 9000000000, ads: 520 },
            { id: 13, name: "Node 13", price: 250000000000, profit: 30000000000, ads: 700 },
            { id: 14, name: "Node 14", price: 1000000000000, profit: 150000000000, ads: 950 },
            { id: 15, name: "Pisto Boss", price: 5000000000000, profit: 800000000000, ads: 1300 }
        ];

        async function init() {
            let p = 0; const l = setInterval(() => { p+=20; document.getElementById('loader-fill').style.width=p+'%'; if(p>=100){clearInterval(l); document.getElementById('loader').style.display='none';}}, 150);
            const s = await getDoc(uRef);
            if(s.exists()){
                const d = s.data(); bal = d.balance || 0; nrg = d.energy || 1000;
                pph = d.pph || 0; ads = d.ads || 0; tgDone = d.tgDone || false;
            } else { await setDoc(uRef, { balance: 0, energy: 1000, pph: 0, ads: 0, tgDone: false }); }
            if(tgDone) { document.getElementById('tg-btn').innerText = "DONE"; document.getElementById('tg-btn').disabled = true; }
            render(); genShop(); loops();
        }

        // Ad Logic
        window.watchFixedAd = () => {
            show_10390421().then(async () => {
                bal += 2000; ads++; render(); genShop();
                await updateDoc(uRef, { balance: bal, ads: ads });
                confetti();
            }).catch(() => tg.showAlert('Ad not ready.'));
        };

        // Telegram Task Logic
        window.handleTgTask = () => {
            window.open('https://t.me/PistoTap_bot', '_blank');
            const btn = document.getElementById('tg-btn');
            btn.innerText = "WAITING...";
            setTimeout(async () => {
                bal += 10000; tgDone = true; render();
                btn.innerText = "DONE"; btn.disabled = true;
                await updateDoc(uRef, { balance: bal, tgDone: true });
                confetti();
                tg.showAlert('10,000 Coins added for joining!');
            }, 5000);
        };

        window.buyNode = async (id, price, profit, reqAds) => {
            if(ads < reqAds) {
                tg.showAlert(`Watch ${reqAds} ads total. Current: ${ads}`);
                return;
            }
            if(bal >= price) {
                bal -= price; pph += profit; render(); genShop();
                await updateDoc(uRef, { balance: bal, pph: pph });
                confetti();
            } else tg.showAlert("Need more coins!");
        };

        function loops() {
            setInterval(() => { if(pph > 0) bal += (pph/3600); if(nrg < 1000) nrg++; render(); }, 1000);
            setInterval(() => updateDoc(uRef, { balance: bal, energy: nrg }), 25000);
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('pph-val').innerText = "+" + Math.floor(pph).toLocaleString();
            document.getElementById('ads-count').innerText = ads;
        }

        function genShop() {
            let h = ""; nodes.forEach(n => {
                const locked = ads < n.ads;
                h += `<div class="card ${locked ? 'locked-card' : ''}">
                    <b style="font-size:12px;">${n.name}</b><br>
                    <small style="color:var(--gold);">+${n.profit.toLocaleString()}/h</small><br>
                    <small style="font-size:9px; color:#666;">Req: ${n.ads} Ads</small>
                    <button class="buy-btn" onclick="buyNode(${n.id}, ${n.price}, ${n.profit}, ${n.ads})">
                        ${locked ? 'LOCKED' : '💰 ' + n.price.toLocaleString()}
                    </button>
                </div>`;
            });
            document.getElementById('shop-container').innerHTML = h;
        }

        window.mine = (e) => {
            if(nrg < 1) return; bal++; nrg--; render();
            const p = document.createElement('div'); p.innerText = '+1'; p.className = 'plus-one';
            const x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
            const y = e.pageY || (e.touches ? e.touches[0].pageY : 0);
            p.style.left = x + 'px'; p.style.top = y + 'px';
            document.body.appendChild(p); setTimeout(() => p.remove(), 700);
        };

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-tab'); el.classList.add('active');
        };

        init();
    </script>
</body>
</html>
