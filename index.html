<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Coin - All Features</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <style>
        body { background: #0b0e11; color: white; text-align: center; font-family: 'Arial', sans-serif; margin: 0; padding: 0; user-select: none; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #1c1f24; border-bottom: 2px solid #f3ba2f; position: sticky; top: 0; z-index: 100; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-value { color: #f3ba2f; font-weight: bold; font-size: 15px; }
        
        .tab-content { display: none; padding: 15px; height: 75vh; overflow-y: auto; padding-bottom: 100px; }
        .active-tab { display: block; }

        .main-balance { font-size: 36px; margin: 15px 0; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 35px; margin-right: 8px; border-radius: 50%; }

        /* Coin Section */
        .coin-btn { width: 200px; height: 200px; border-radius: 50%; border: 8px solid #2c2f35; cursor: pointer; transition: transform 0.05s; }
        .coin-btn:active { transform: scale(0.92); }
        .energy-bar-bg { width: 80%; height: 10px; background: #333; border-radius: 10px; margin: 10px auto; overflow: hidden; }
        .energy-bar-fill { width: 100%; height: 100%; background: #f3ba2f; }

        /* Card Grid */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .card { background: #1c1f24; padding: 12px; border-radius: 12px; border: 1px solid #333; text-align: left; }
        .card h4 { margin: 0; font-size: 12px; white-space: nowrap; overflow: hidden; }
        .buy-btn, .task-btn, .wallet-btn { background: #f3ba2f; color: #000; border: none; padding: 8px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; margin-top: 5px; }

        /* Tasks & Leaders */
        .list-container { background: #1c1f24; border-radius: 12px; margin-top: 10px; text-align: left; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #333; }
        
        /* Footer */
        .footer { position: fixed; bottom: 0; width: 100%; background: #1c1f24; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { font-size: 10px; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #f3ba2f; }
        .plus-one { position: absolute; color: #f3ba2f; font-size: 26px; font-weight: bold; animation: floatUp 0.6s forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

    <div class="header">
        <div><span class="stat-label">Profit/hr</span><br><span id="pph-val" class="stat-value">+0</span></div>
        <div><span class="stat-label">Rank</span><br><span id="rank-name" class="stat-value">Bronze</span></div>
    </div>

    <div id="tab-exchange" class="tab-content active-tab">
        <div class="main-balance"><img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg"> <span id="balance">0</span></div>
        <img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg" class="coin-btn" onclick="mine(event)">
        <div style="margin-top: 20px;">
            <div>⚡ <span id="energy">1000</span> / 1000</div>
            <div class="energy-bar-bg"><div id="energy-bar" class="energy-bar-fill"></div></div>
        </div>
    </div>

    <div id="tab-mine" class="tab-content">
        <h3 style="color:#f3ba2f;">Mining Farm</h3>
        <div class="card-grid" id="card-container"></div>
    </div>

    <div id="tab-earn" class="tab-content">
        <h3 style="color:#f3ba2f;">Daily Tasks</h3>
        <div class="list-container">
            <div class="list-item"><div><h4>Join Channel</h4><p>+50,000</p></div><button class="task-btn" onclick="doTask('https://t.me/yourchannel', 50000, this)">Start</button></div>
            <div class="list-item"><div><h4>Watch Video</h4><p>+20,000</p></div><button class="task-btn" onclick="doTask('https://youtube.com', 20000, this)">Start</button></div>
        </div>
    </div>

    <div id="tab-leader" class="tab-content">
        <h3>🏆 Global Leaders</h3>
        <div id="leaderboard-list" class="list-container"></div>
    </div>

    <div id="tab-airdrop" class="tab-content">
        <h3 style="color:#f3ba2f;">Wallet Connect</h3>
        <div style="background:#1c1f24; padding:20px; border-radius:15px; border:1px solid #333;">
            <p>Connect your TON wallet for Airdrop.</p>
            <button id="wallet-btn" class="wallet-btn" style="background:#0088cc; color:white;" onclick="connectWallet()">💎 Connect TON Wallet</button>
            <p id="wallet-addr" style="font-size:10px; color:#f3ba2f; margin-top:10px;"></p>
        </div>
    </div>

    <div class="footer">
        <div class="nav-item active" onclick="showTab('tab-exchange', this)">🏠<span>Exchange</span></div>
        <div class="nav-item" onclick="showTab('tab-mine', this)">⛏️<span>Mine</span></div>
        <div class="nav-item" onclick="showTab('tab-earn', this)">💰<span>Earn</span></div>
        <div class="nav-item" onclick="showTab('tab-leader', this); loadLeaders()">🏆<span>Leaders</span></div>
        <div class="nav-item" onclick="showTab('tab-airdrop', this)">🏦<span>Airdrop</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0kFdBKIQIisg3dWBWczSRVIzdv7fe9I",
            authDomain: "pisto-d65eb.firebaseapp.com",
            projectId: "pisto-d65eb",
            storageBucket: "pisto-d65eb.firebasestorage.app",
            messagingSenderId: "690904339160",
            appId: "1:690904339160:web:eaa9b217bba7244ff6bdad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, nrg = 1000, pph = 0;
        const user = tg.initDataUnsafe.user;
        const userId = (user?.id || "test_user").toString();
        const userRef = doc(db, "users", userId);

        const cardNames = ["CPU 1", "GPU X", "ASIC Miner", "Cloud S1", "Data Farm", "Quantum X", "AI Core", "PR Team", "Market Hub", "CEO Desk", "KYC Base", "Mars Node", "Sat Link", "Dev Team", "Security", "Swiss Vault", "Global HQ", "Token Lab", "Web3 Hub", "NFT Box", "Exchange", "Venture", "Mars Base", "Oil Rig", "Gold Mine", "Smart Dev", "Hamster S", "Pisto Pro", "Super Dev", "Crypto S", "Logic X", "Nano Chip", "Solar S", "Wind Farm", "Deep Sea", "Galaxy", "Empire", "Space X", "Pisto Hub", "Ultimate"];

        async function init() {
            const snap = await getDoc(userRef);
            if(snap.exists()){
                bal = snap.data().balance || 0;
                nrg = snap.data().energy || 1000;
                pph = snap.data().pph || 0;
                if(snap.data().wallet) document.getElementById('wallet-addr').innerText = snap.data().wallet.substring(0,15)+"...";
            } else {
                await setDoc(userRef, { name: user?.first_name || "Miner", balance: 0, energy: 1000, pph: 0 });
            }
            render();
            genCards();
        }

        function genCards() {
            let h = "";
            cardNames.forEach((n, i) => {
                let p = (i + 1) * 800, pr = (i + 1) * 120;
                h += `<div class="card"><h4>${n}</h4><p>+${pr}/hr</p><button class="buy-btn" onclick="buyCard(${p}, ${pr})">🪙 ${p.toLocaleString()}</button></div>`;
            });
            document.getElementById('card-container').innerHTML = h;
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('energy').innerText = nrg;
            document.getElementById('pph-val').innerText = "+" + pph.toLocaleString();
            document.getElementById('energy-bar').style.width = (nrg/10) + "%";
        }

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-tab');
            el.classList.add('active');
        };

        window.mine = (e) => {
            if(nrg <= 0) return;
            bal++; nrg--; render();
            const p = document.createElement('div');
            p.innerText = '+1'; p.className = 'plus-one'; p.style.left = e.pageX+'px'; p.style.top = e.pageY+'px';
            document.body.appendChild(p); setTimeout(() => p.remove(), 600);
            updateDoc(userRef, { balance: bal, energy: nrg });
        };

        window.buyCard = async (price, profit) => {
            if(bal >= price) {
                bal -= price; pph += profit; render();
                await updateDoc(userRef, { balance: bal, pph: pph });
            } else { tg.showAlert("Need more coins!"); }
        };

        window.doTask = (url, reward, btn) => {
            tg.openLink(url);
            btn.innerText = "Checking...";
            setTimeout(async () => {
                bal += reward; render();
                await updateDoc(userRef, { balance: bal });
                btn.innerText = "Claimed"; btn.disabled = true;
            }, 4000);
        };

        window.loadLeaders = async () => {
            const q = query(collection(db, "users"), orderBy("balance", "desc"), limit(10));
            const snap = await getDocs(q);
            let h = ""; let r = 1;
            snap.forEach(d => {
                h += `<div class="list-item"><span>#${r++} ${d.data().name}</span><b>${Math.floor(d.data().balance).toLocaleString()}</b></div>`;
            });
            document.getElementById('leaderboard-list').innerHTML = h;
        };

        window.connectWallet = () => {
            tg.showConfirm("Connect to your Telegram TON Wallet?", async (ok) => {
                if(ok) {
                    const addr = "UQ"+Math.random().toString(36).substr(2, 20).toUpperCase();
                    document.getElementById('wallet-addr').innerText = "Address: " + addr;
                    document.getElementById('wallet-btn').innerText = "Connected ✅";
                    await updateDoc(userRef, { wallet: addr });
                }
            });
        };

        setInterval(() => { if(pph > 0) bal += (pph/3600); if(nrg < 1000) nrg++; render(); }, 1000);
        init();
    </script>
</body>
</html>
