<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Coin - Wallet Connect</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <style>
        body { background: #0b0e11; color: white; text-align: center; font-family: 'Arial', sans-serif; margin: 0; padding: 0; user-select: none; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #1c1f24; border-bottom: 2px solid #f3ba2f; position: sticky; top: 0; z-index: 100; }
        .stat-label { font-size: 10px; color: #888; }
        .stat-value { color: #f3ba2f; font-weight: bold; font-size: 15px; }
        
        .tab-content { display: none; padding: 15px; height: 75vh; overflow-y: auto; padding-bottom: 100px; }
        .active-tab { display: block; }

        .main-balance { font-size: 40px; margin: 15px 0; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 35px; margin-right: 8px; border-radius: 50%; }

        .coin-btn { width: 220px; height: 220px; border-radius: 50%; border: 8px solid #2c2f35; cursor: pointer; transition: transform 0.05s; }
        .coin-btn:active { transform: scale(0.92); }

        /* Wallet Section */
        .wallet-card { background: #1c1f24; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-top: 20px; }
        .wallet-btn { background: #0088cc; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; }
        .wallet-address { font-size: 10px; color: #f3ba2f; margin-top: 10px; word-break: break-all; }

        .footer { position: fixed; bottom: 0; width: 100%; background: #1c1f24; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { font-size: 10px; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #f3ba2f; }
    </style>
</head>
<body>

    <div class="header">
        <div><span class="stat-label">Profit / hr</span><br><span id="pph-val" class="stat-value">+0</span></div>
        <div><span class="stat-label">Rank</span><br><span id="rank-name" class="stat-value">Bronze</span></div>
    </div>

    <div id="exchange-tab" class="tab-content active-tab">
        <div class="main-balance"><img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg"> <span id="balance">0</span></div>
        <img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg" class="coin-btn" onclick="mine(event)">
        <div style="margin-top: 20px;">
            <div>⚡ <span id="energy">1000</span> / 1000</div>
            <div style="width: 80%; height: 10px; background: #333; border-radius: 10px; margin: 10px auto; overflow: hidden;">
                <div id="energy-bar" style="width: 100%; height: 100%; background: #f3ba2f;"></div>
            </div>
        </div>
    </div>

    <div id="airdrop-tab" class="tab-content">
        <h2 style="color:#f3ba2f;">Airdrop Task</h2>
        <p>Connect your TON wallet to be eligible for $PISTO token distribution.</p>
        
        <div class="wallet-card">
            <button id="connect-btn" class="wallet-btn" onclick="connectWallet()">💎 Connect TON Wallet</button>
            <div id="address-display" class="wallet-address"></div>
        </div>

        <div style="margin-top: 30px; text-align: left; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px;">
            <h4>Listing Roadmap:</h4>
            <p style="font-size: 12px; color: #aaa;">• Phase 1: Community Growth<br>• Phase 2: Wallet Integration (Live)<br>• Phase 3: $PISTO TGE & Airdrop</p>
        </div>
    </div>

    <div class="footer">
        <div class="nav-item active" onclick="showTab('exchange-tab', this)">🏠<span>Exchange</span></div>
        <div class="nav-item" onclick="showTab('airdrop-tab', this)">🏦<span>Airdrop</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0kFdBKIQIisg3dWBWczSRVIzdv7fe9I",
            authDomain: "pisto-d65eb.firebaseapp.com",
            projectId: "pisto-d65eb",
            storageBucket: "pisto-d65eb.firebasestorage.app",
            messagingSenderId: "690904339160",
            appId: "1:690904339160:web:eaa9b217bba7244ff6bdad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, nrg = 1000, pph = 0;
        const userId = (tg.initDataUnsafe.user?.id || "test_user").toString();
        const userRef = doc(db, "users", userId);

        // Wallet Logic using TonConnect
        const connector = new TonConnectSDK.TonConnect({
            manifestUrl: 'https://wmbdsf81-create.github.io/pisto-coin-bot/tonconnect-manifest.json'
        });

        window.connectWallet = async () => {
            const walletConnectionSource = {
                universalLink: 'https://t.me/wallet?attach=wallet',
                bridgeUrl: 'https://bridge.tonapi.io/bridge'
            };
            
            // সহজ করার জন্য টেলিগ্রামের ইন্টারনাল এলার্ট দেখাচ্ছি
            tg.showConfirm("Do you want to connect your Telegram Wallet?", async (ok) => {
                if(ok) {
                    // এখানে ইউজারকে ওয়ালেট অপশন দেখাচ্ছি
                    document.getElementById('connect-btn').innerText = "Connecting...";
                    setTimeout(() => {
                        const fakeAddress = "0:QWERTY1234567890ASDFGHJKLMNBVCXZ"; // ডেমো এড্রেস
                        document.getElementById('address-display').innerText = "Connected: " + fakeAddress.substring(0,10) + "...";
                        document.getElementById('connect-btn').innerText = "Wallet Connected ✅";
                        updateDoc(userRef, { wallet: fakeAddress });
                    }, 2000);
                }
            });
        };

        async function init() {
            const snap = await getDoc(userRef);
            if(snap.exists()){
                bal = snap.data().balance || 0;
                nrg = snap.data().energy || 1000;
                pph = snap.data().pph || 0;
                if(snap.data().wallet) {
                    document.getElementById('connect-btn').innerText = "Wallet Connected ✅";
                    document.getElementById('address-display').innerText = "Connected: " + snap.data().wallet.substring(0,10) + "...";
                }
            }
            render();
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('energy').innerText = nrg;
            document.getElementById('energy-bar').style.width = (nrg/10) + "%";
        }

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-tab');
            el.classList.add('active');
        };

        window.mine = (e) => {
            if(nrg <= 0) return;
            bal++; nrg--; render();
            updateDoc(userRef, { balance: bal, energy: nrg });
        };

        setInterval(() => {
            if(pph > 0) bal += (pph / 3600);
            if(nrg < 1000) nrg++;
            render();
        }, 1000);

        init();
    </script>
</body>
</html>
