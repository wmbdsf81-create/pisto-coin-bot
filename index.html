<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Coin - Hamster Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* CSS অংশ */
        body { background: #000; color: white; text-align: center; font-family: 'Arial', sans-serif; margin: 0; overflow: hidden; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #1c1f24; border-bottom: 2px solid #f3ba2f; }
        .stat-value { color: #f3ba2f; font-weight: bold; font-size: 18px; }
        .main-balance { font-size: 45px; margin: 20px 0; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 40px; margin-right: 10px; }
        .coin-btn { width: 250px; height: 250px; border-radius: 50%; cursor: pointer; transition: transform 0.05s; border: 8px solid #2c2f35; box-shadow: 0 0 30px #f3ba2f33; }
        .coin-btn:active { transform: scale(0.95); }
        .energy-bar-bg { width: 80%; height: 12px; background: #333; border-radius: 10px; margin: 10px auto; overflow: hidden; }
        .energy-bar-fill { width: 100%; height: 100%; background: linear-gradient(to right, #f3ba2f, #ffea00); transition: width 0.2s; }
        .footer { position: fixed; bottom: 0; width: 100%; background: #1c1f24; display: flex; justify-content: space-around; padding: 12px 0; }
        .nav-item { font-size: 12px; color: #888; cursor: pointer; }
        .active { color: #f3ba2f; }
        .plus-one { position: absolute; color: #f3ba2f; font-size: 26px; font-weight: bold; animation: floatUp 0.7s forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

    <div class="header">
        <div>Profit per hour<br><span id="pph-val" class="stat-value">+0</span></div>
        <div>Pisto Rank<br><span class="stat-value" style="color:white">Bronze</span></div>
    </div>

    <div class="main-balance"><img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg" alt="coin"> <span id="balance">0</span></div>

    <div id="coin-area" style="position: relative;">
        <img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg" class="coin-btn" onclick="mine(event)" alt="Pisto">
    </div>

    <div style="margin-top: 25px;">
        <div>⚡ <span id="energy">1000</span> / 1000</div>
        <div class="energy-bar-bg"><div id="energy-bar" class="energy-bar-fill"></div></div>
    </div>

    <div class="footer">
        <div class="nav-item active">🏠 Exchange</div>
        <div class="nav-item">⛏️ Mine</div>
        <div class="nav-item">👥 Friends</div>
        <div class="nav-item">💰 Earn</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0kFdBKIQIisg3dWBWczSRVIzdv7fe9I",
            authDomain: "pisto-d65eb.firebaseapp.com",
            projectId: "pisto-d65eb",
            storageBucket: "pisto-d65eb.firebasestorage.app",
            messagingSenderId: "690904339160",
            appId: "1:690904339160:web:eaa9b217bba7244ff6bdad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, nrg = 1000, pph = 0;
        const userRef = doc(db, "users", (tg.initDataUnsafe.user?.id || "test_user").toString());

        async function loadData() {
            const snap = await getDoc(userRef);
            if(snap.exists()){
                bal = snap.data().balance || 0;
                nrg = snap.data().energy || 1000;
                pph = snap.data().pph || 0;
            } else {
                await setDoc(userRef, { balance: 0, energy: 1000, pph: 0 });
            }
            render();
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('energy').innerText = nrg;
            document.getElementById('pph-val').innerText = "+" + pph;
            document.getElementById('energy-bar').style.width = (nrg/10) + "%";
        }

        window.mine = (e) => {
            if(nrg <= 0) return;
            bal++; nrg--;
            render();
            // Animation
            const p = document.createElement('div');
            p.innerText = '+1'; p.className = 'plus-one';
            p.style.left = e.pageX + 'px'; p.style.top = e.pageY + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 700);
            updateDoc(userRef, { balance: bal, energy: nrg });
        };

        // Profit Per Hour Logic
        setInterval(() => {
            if(pph > 0) {
                bal += (pph / 3600);
                render();
            }
            if(nrg < 1000) { nrg++; render(); }
        }, 1000);

        loadData();
    </script>
</body>
</html>
