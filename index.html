<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, getDocs, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDTpsebnsHvl9RI9hjkA3VnRY9-NX0ESo8", 
        authDomain: "pisto-f4f26.firebaseapp.com", 
        projectId: "pisto-f4f26", 
        storageBucket: "pisto-f4f26.firebasestorage.app", 
        messagingSenderId: "345148284758", 
        appId: "1:345148284758:web:fc6e1174cb2022842400f7" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tg = window.Telegram.WebApp;

    // Game State
    let bal = 0, pph = 0, ads = 0, refs = 0, energy = 1000, maxEnergy = 1000;
    let tapPower = 1, dailyAdRefills = 0, lastTap = 0, tapCount = 0;
    let streak = 0, lastLoginDate = "";

    const MAX_DAILY_REFILLS = 5;
    const TAP_LIMIT_PER_SEC = 10; // Anti-cheat threshold

    const uid = (tg.initDataUnsafe.user?.id || "pisto_user").toString();
    const uname = tg.initDataUnsafe.user?.first_name || "Miner";
    const uRef = doc(db, "users", uid);

    async function init() {
        const s = await getDoc(uRef);
        if(s.exists()){
            const d = s.data();
            bal = d.balance || 0; pph = d.pph || 0;
            ads = d.ads || 0; refs = d.refCount || 0;
            energy = d.energy || 1000; maxEnergy = d.maxEnergy || 1000;
            dailyAdRefills = d.dailyAdRefills || 0;
            streak = d.streak || 0;
            lastLoginDate = d.lastLoginDate || "";
        } else {
            // New User Setup
            await setDoc(uRef, { 
                balance: 1000, pph: 0, ads: 0, refCount: 0, name: uname, 
                energy: 1000, maxEnergy: 1000, streak: 0, dailyAdRefills: 0 
            });
        }
        
        checkDailyReward();
        render();
        mainLoop();
        updateMissions();
    }

    // --- 1. Ad -> Energy Refill System ---
    window.refillEnergyAd = async () => {
        if (dailyAdRefills >= MAX_DAILY_REFILLS) {
            tg.showAlert(`Limit reached! You can refill ${MAX_DAILY_REFILLS} times daily.`);
            return;
        }

        show_10390421().then(async () => {
            energy = maxEnergy;
            dailyAdRefills++;
            await updateDoc(uRef, { energy: maxEnergy, dailyAdRefills: increment(1) });
            render();
            tg.showAlert("Energy fully restored! ⚡");
        }).catch(() => tg.showAlert("Ad failed to load. Try again later."));
    };

    // --- 2. Anti-Cheat System ---
    function isCheating() {
        const now = Date.now();
        if (now - lastTap < 1000) {
            tapCount++;
        } else {
            tapCount = 1;
            lastTap = now;
        }
        return tapCount > TAP_LIMIT_PER_SEC;
    }

    window.mine = (e) => {
        if (isCheating()) {
            console.warn("Tap rate exceeded limit.");
            return;
        }
        if (energy < tapPower) return;

        bal += tapPower;
        energy -= tapPower;
        render();
        
        // Visual Feedback (floating text)
        const p = document.createElement('div');
        p.innerText = `+${tapPower}`;
        p.style.cssText = `position:absolute; left:${e.pageX || e.touches[0].pageX}px; top:${e.pageY || e.touches[0].pageY}px; color:var(--gold); animation:float 0.8s forwards; font-weight:bold; pointer-events:none;`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
    };

    // --- 3. Referral Mission System ---
    function updateMissions() {
        const progress = Math.min((refs / 1000) * 100, 100);
        // Assuming you have a div with id 'mission-box'
        const missionHTML = `
            <div class="card" style="border: 1px solid var(--gold); margin-top:10px;">
                <b>🚀 Referral Milestone</b><br>
                <small>1,000 Friends = $100 Reward (Listing Gift)</small>
                <div class="energy-bar" style="width:100%; height:8px; margin:10px 0;">
                    <div class="energy-fill" style="width:${progress}%; background:var(--green);"></div>
                </div>
                <small>${refs}/1000 referrals</small>
                <button class="buy-btn" disabled style="background:#222; color:#555;">
                    ${refs >= 1000 ? "LOCKED UNTIL LISTING" : "IN PROGRESS"}
                </button>
            </div>
        `;
        // Inject into your tasks tab
        const taskTab = document.getElementById('tab-tasks');
        if (taskTab) {
            const existingMission = document.getElementById('milestone-ui');
            if (!existingMission) {
                const div = document.createElement('div');
                div.id = "milestone-ui";
                div.innerHTML = missionHTML;
                taskTab.prepend(div);
            }
        }
    }

    // --- 4 & 5. Daily Reward & Streak System ---
    async function checkDailyReward() {
        const today = new Date().toISOString().split('T')[0];
        
        if (lastLoginDate === today) return; // Already claimed today

        const lastDate = new Date(lastLoginDate);
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().split('T')[0];

        if (lastLoginDate === yesterdayStr) {
            streak++;
        } else {
            streak = 1; // Reset streak if missed a day
        }

        const bonus = 5000 * streak;
        bal += bonus;
        lastLoginDate = today;
        dailyAdRefills = 0; // Reset ad refills daily

        await updateDoc(uRef, { 
            balance: increment(bonus), 
            streak: streak, 
            lastLoginDate: today,
            dailyAdRefills: 0
        });

        tg.showAlert(`Day ${streak} Streak! You earned ${bonus.toLocaleString()} coins! 🎁`);
        render();
    }

    // --- 6. Energy System Improvements ---
    function mainLoop() {
        setInterval(() => { 
            // Passive Regen
            if(energy < maxEnergy) energy = Math.min(energy + 2, maxEnergy); 
            
            // Passive Income (PPH)
            if(pph > 0) bal += (pph/3600); 
            
            render(); 
        }, 1000);

        // Periodic Sync with Firestore
        setInterval(() => {
            updateDoc(uRef, { balance: bal, energy: energy });
        }, 15000);
    }

    function render() {
        document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
        document.getElementById('pph-val').innerText = "+" + Math.floor(pph).toLocaleString();
        document.getElementById('ref-count').innerText = refs;
        document.getElementById('ads-count').innerText = `${MAX_DAILY_REFILLS - dailyAdRefills} Left`;
        
        const energyFill = document.getElementById('energy-fill');
        energyFill.style.width = (energy/maxEnergy)*100 + '%';
        document.getElementById('energy-text').innerText = `${Math.floor(energy)}/${maxEnergy}`;
    }

    // Initialize the app
    init();

</script>
