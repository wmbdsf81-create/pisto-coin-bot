<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Coin - Full Hamster Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: white; text-align: center; font-family: 'Arial', sans-serif; margin: 0; padding: 0; user-select: none; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #1c1f24; border-bottom: 2px solid #f3ba2f; }
        .stat-box { font-size: 14px; color: #aaa; }
        .stat-value { color: #f3ba2f; font-weight: bold; font-size: 18px; }
        
        .main-balance { font-size: 40px; margin: 30px 0; font-weight: bold; color: #fff; }
        
        .coin-section { position: relative; display: flex; justify-content: center; margin-top: 20px; }
        .coin-btn { width: 240px; height: 240px; border-radius: 50%; box-shadow: 0 0 50px #f3ba2f55; cursor: pointer; transition: transform 0.05s; }
        .coin-btn:active { transform: scale(0.95); }

        .energy-section { margin-top: 30px; padding: 0 20px; }
        .energy-bar-bg { width: 100%; height: 12px; background: #333; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        .energy-bar-fill { width: 100%; height: 100%; background: linear-gradient(to right, #f3ba2f, #ffea00); transition: width 0.2s; }
        .energy-text { font-size: 18px; font-weight: bold; margin-bottom: 5px; }

        .footer { position: fixed; bottom: 0; width: 100%; background: #1c1f24; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav-item { font-size: 12px; color: #888; text-decoration: none; cursor: pointer; }
        .nav-item.active { color: #f3ba2f; }

        .plus-one { position: absolute; color: #f3ba2f; font-size: 28px; font-weight: bold; animation: floatUp 0.8s ease-out forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat-box">Profit per hour<br><span class="stat-value">+0</span></div>
        <div class="stat-box">Pisto Rank<br><span class="stat-value" style="color:white">Bronze</span></div>
    </div>

    <div class="main-balance">🪙 <span id="balance">0</span></div>

    <div class="coin-section">
        <img src="https://i.ibb.co/Kz9P3Zy/pisto-coin.jpg" class="coin-btn" onclick="mine(event)">
    </div>

    <div class="energy-section">
        <div class="energy-text">⚡ <span id="energy">1000</span> / 1000</div>
        <div class="energy-bar-bg"><div id="energy-bar" class="energy-bar-fill"></div></div>
    </div>

    <div class="footer">
        <div class="nav-item active">🏠 Exchange</div>
        <div class="nav-item">⛏️ Mine</div>
        <div class="nav-item">👥 Friends</div>
        <div class="nav-item">💰 Earn</div>
        <div class="nav-item">🏦 Airdrop</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0kFdBKIQIisg3dWBWczSRVIzdv7fe9I",
            authDomain: "pisto-d65eb.firebaseapp.com",
            projectId: "pisto-d65eb",
            storageBucket: "pisto-d65eb.firebasestorage.app",
            messagingSenderId: "690904339160",
            appId: "1:690904339160:web:eaa9b217bba7244ff6bdad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const userId = tg.initDataUnsafe.user?.id || "test_user";
        const userRef = doc(db, "users", userId.toString());

        async function load() {
            const docSnap = await getDoc(userRef);
            if (docSnap.exists()) {
                balance = docSnap.data().balance || 0;
                energy = docSnap.data().energy || 1000;
                updateUI();
            } else {
                await setDoc(userRef, { balance: 0, energy: 1000 });
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('energy').innerText = energy;
            document.getElementById('energy-bar').style.width = (energy / maxEnergy * 100) + "%";
        }

        window.mine = async function(event) {
            if (energy <= 0) return;

            balance++;
            energy--;
            updateUI();

            // Animation
            const plus = document.createElement('div');
            plus.innerText = '+1';
            plus.className = 'plus-one';
            plus.style.left = event.clientX - 20 + 'px';
            plus.style.top = event.clientY - 40 + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 800);

            // Sync with Firebase
            await updateDoc(userRef, { balance: increment(1), energy: energy });
        };

        // Energy Recovery (অটোমেটিক শক্তি বাড়বে)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateUI();
                updateDoc(userRef, { energy: energy });
            }
        }, 3000); // প্রতি ৩ সেকেন্ডে ১ করে শক্তি বাড়বে

        load();
    </script>
</body>
</html>
