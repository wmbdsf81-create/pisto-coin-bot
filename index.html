<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Miner V2 - Hard Mode Pro</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src='//libtl.com/sdk.js' data-zone='10390421' data-sdk='show_10390421'></script>

    <style>
        :root { --gold: #f3ba2f; --dark: #080a0c; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --red: #f42a41; --green: #006a4e; }
        body { background: var(--dark); color: #fff; text-align: center; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; overflow-x: hidden; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #080a0c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader-bar-bg { width: 200px; height: 4px; background: #1a1d23; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .loader-bar-fill { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }

        .header { display: flex; justify-content: space-around; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; }
        .stat-box { background: var(--glass); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 12px; min-width: 100px; }
        .stat-value { color: var(--gold); font-weight: 800; font-size: 14px; }

        .tab-content { display: none; padding: 20px; padding-bottom: 120px; }
        .active-tab { display: block; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .main-balance { font-size: 42px; margin: 20px 0; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; border: 2px solid var(--gold); }

        .coin-btn { width: 220px; height: 220px; border-radius: 50%; border: 10px solid #1a1d23; cursor: pointer; transition: 0.1s; }
        .coin-btn:active { transform: scale(0.9); }

        .bd-text { font-weight: 900; font-size: 18px; margin-top: 15px; letter-spacing: 0.5px; }
        .bd-green { color: var(--green); }
        .bd-red { color: var(--red); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .card { background: linear-gradient(145deg, #1a0000, #080a0c); border: 1px solid var(--glass-border); padding: 15px; border-radius: 18px; text-align: left; position: relative; }
        .locked-card { opacity: 0.5; filter: grayscale(1); }
        
        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 900; cursor: pointer; margin-top: 10px; }
        
        .task-item { background: var(--glass); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .claim-btn { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .footer { position: fixed; bottom: 15px; left: 5%; width: 90%; background: rgba(18, 22, 28, 0.98); border: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 15px 0; border-radius: 25px; z-index: 1000; backdrop-filter: blur(10px); }
        .nav-item { font-size: 11px; color: #555; cursor: pointer; text-align: center; font-weight: bold; }
        .nav-item.active { color: var(--gold); }

        .plus-one { position: absolute; color: var(--gold); font-size: 28px; font-weight: 900; animation: floatUp 0.8s forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

    <div id="loader">
        <img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png" style="width:100px; border-radius:50%; border:2px solid var(--gold);">
        <h2 style="color:var(--gold); margin-top:15px;">PISTO MINER V2</h2>
        <div class="loader-bar-bg"><div id="loader-fill" class="loader-bar-fill"></div></div>
    </div>

    <div class="header">
        <div class="stat-box"><span>PROFIT/HR</span><br><span id="pph-val" class="stat-value">0</span></div>
        <div class="stat-box"><span>ADS WATCHED</span><br><span id="ads-count" class="stat-value">0</span></div>
    </div>

    <div id="tab-home" class="tab-content active-tab">
        <div class="main-balance"><img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png"><span id="balance">0</span></div>
        <img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png" class="coin-btn" onclick="mine(event)">
        
        <div class="bd-text">
            <span style="color:var(--gold)">PISTO</span> 
            <span class="bd-green">POWERED BY</span> 
            <span class="bd-red">BANGLADESH 🇧🇩</span>
        </div>

        <button onclick="watchFixedAd()" style="background:var(--red); color:white; border:none; padding:15px; border-radius:15px; margin-top:20px; width:85%; font-weight:900; cursor:pointer; box-shadow: 0 4px 15px rgba(244,42,65,0.4);">
            📺 WATCH AD (GET 2,000 COINS)
        </button>

        <div style="width: 85%; margin: 25px auto;">
            <div style="display:flex; justify-content: space-between; font-size: 12px; margin-bottom:5px;"><span>⚡ Energy</span><span><span id="energy">1000</span>/1000</span></div>
            <div style="width:100%; height:8px; background: #1a1d23; border-radius: 10px;"><div id="energy-bar" style="width:100%; height:100%; background: var(--gold);"></div></div>
        </div>
    </div>

    <div id="tab-mine" class="tab-content">
        <h3 style="text-align:left; color:var(--gold);">⛏️ MINING RIGS</h3>
        <p style="text-align:left; font-size:11px; color:#888;">Complete ad requirements to unlock rigs.</p>
        <div id="shop-container" class="grid"></div>
    </div>

    <div id="tab-tasks" class="tab-content">
        <h3 style="text-align:left; color:var(--gold);">🎁 TASK LIST</h3>
        
        <div class="task-item">
            <div><b>Daily Reward Ad</b><br><small>+2,000 Coins</small></div>
            <button class="claim-btn" onclick="watchFixedAd()">START</button>
        </div>

        <div class="task-item">
            <div><b>Premium Bonus Ad</b><br><small>+2,000 Coins</small></div>
            <button class="claim-btn" onclick="watchFixedAd()">START</button>
        </div>

        <div class="task-item">
            <div><b>Join Official Bot</b><br><small>+10,000 Coins</small></div>
            <button class="claim-btn" onclick="window.open('https://t.me/PistoTap_bot')">JOIN</button>
        </div>
    </div>

    <div class="footer">
        <div class="nav-item active" onclick="showTab('tab-home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="showTab('tab-mine', this)">⛏️<br>Mine</div>
        <div class="nav-item" onclick="showTab('tab-tasks', this)">📋<br>Tasks</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTpsebnsHvl9RI9hjkA3VnRY9-NX0ESo8",
            authDomain: "pisto-f4f26.firebaseapp.com",
            projectId: "pisto-f4f26",
            storageBucket: "pisto-f4f26.firebasestorage.app",
            messagingSenderId: "345148284758",
            appId: "1:345148284758:web:fc6e1174cb2022842400f7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, nrg = 1000, pph = 0, ads = 0;
        const uid = (tg.initDataUnsafe.user?.id || "pisto_pro_user").toString();
        const uRef = doc(db, "users", uid);

        const nodes = [
            { id: 1, name: "Bronze Rig", price: 20000, profit: 800, ads: 0 },
            { id: 2, name: "Silver Rig", price: 80000, profit: 3500, ads: 5 },
            { id: 3, name: "Gold Rig", price: 300000, profit: 15000, ads: 12 },
            { id: 4, name: "Platinum Rig", price: 1500000, profit: 75000, ads: 25 },
            { id: 5, name: "Diamond Node", price: 7000000, profit: 380000, ads: 45 },
            { id: 6, name: "Ruby Server", price: 25000000, profit: 1500000, ads: 70 },
            { id: 7, name: "Emerald Cloud", price: 120000000, profit: 7500000, ads: 100 },
            { id: 8, name: "Sapphire Pro", price: 600000000, profit: 42000000, ads: 150 },
            { id: 9, name: "Cyber Hub", price: 2500000000, profit: 180000000, ads: 220 },
            { id: 10, name: "Matrix Node", price: 12000000000, profit: 950000000, ads: 320 },
            { id: 11, name: "BD Legend", price: 60000000000, profit: 5000000000, ads: 500 },
            { id: 12, name: "Pisto Emperor", price: 300000000000, profit: 30000000000, ads: 850 }
        ];

        async function init() {
            let p = 0; const l = setInterval(() => { p+=20; document.getElementById('loader-fill').style.width=p+'%'; if(p>=100){clearInterval(l); document.getElementById('loader').style.display='none';}}, 150);
            const s = await getDoc(uRef);
            if(s.exists()){
                const d = s.data(); bal = d.balance || 0; nrg = d.energy || 1000;
                pph = d.pph || 0; ads = d.ads || 0;
            } else { await setDoc(uRef, { balance: 0, energy: 1000, pph: 0, ads: 0 }); }
            render(); genShop(); loops();
        }

        // The ONLY Ad Function (Runs 10390421)
        window.watchFixedAd = () => {
            show_10390421().then(async () => {
                bal += 2000; ads++; render(); genShop();
                await updateDoc(uRef, { balance: bal, ads: ads });
                confetti(); tg.showAlert('Success: +2,000 Coins Received!');
            }).catch(() => tg.showAlert('Ad not available at the moment.'));
        };

        window.buyNode = async (id, price, profit, reqAds) => {
            if(ads < reqAds) {
                tg.showAlert(`Access Denied! Watch ${reqAds} ads total to unlock. Current: ${ads}`);
                return;
            }
            if(bal >= price) {
                bal -= price; pph += profit; render(); genShop();
                await updateDoc(uRef, { balance: bal, pph: pph });
                confetti();
            } else tg.showAlert("Need more coins!");
        };

        function loops() {
            setInterval(() => { if(pph > 0) bal += (pph/3600); if(nrg < 1000) nrg++; render(); }, 1000);
            setInterval(() => updateDoc(uRef, { balance: bal, energy: nrg }), 25000);
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('pph-val').innerText = "+" + Math.floor(pph).toLocaleString();
            document.getElementById('energy').innerText = nrg;
            document.getElementById('energy-bar').style.width = (nrg/10) + "%";
            document.getElementById('ads-count').innerText = ads;
        }

        function genShop() {
            let h = ""; nodes.forEach(n => {
                const locked = ads < n.ads;
                h += `<div class="card ${locked ? 'locked-card' : ''}">
                    <b style="font-size:13px;">${n.name}</b><br>
                    <small style="color:var(--gold);">+${n.profit.toLocaleString()}/h</small><br>
                    <small style="font-size:10px; color:#777;">Req: ${n.ads} Ads</small>
                    <button class="buy-btn" onclick="buyNode(${n.id}, ${n.price}, ${n.profit}, ${n.ads})">
                        ${locked ? 'LOCKED 🔒' : '💰 ' + n.price.toLocaleString()}
                    </button>
                </div>`;
            });
            document.getElementById('shop-container').innerHTML = h;
        }

        window.mine = (e) => {
            if(nrg < 1) return; bal++; nrg--; render();
            const p = document.createElement('div'); p.innerText = '+1'; p.className = 'plus-one';
            const x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
            const y = e.pageY || (e.touches ? e.touches[0].pageY : 0);
            p.style.left = x + 'px'; p.style.top = y + 'px';
            document.body.appendChild(p); setTimeout(() => p.remove(), 700);
        };

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-tab'); el.classList.add('active');
        };

        init();
    </script>
</body>
</html>
