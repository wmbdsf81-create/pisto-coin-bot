<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Miner V2 - Leaderboard Edition</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src='//libtl.com/sdk.js' data-zone='10390421' data-sdk='show_10390421'></script>

    <style>
        :root { --gold: #f3ba2f; --dark: #080a0c; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --red: #f42a41; --green: #006a4e; }
        body { background: var(--dark); color: #fff; text-align: center; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; overflow-x: hidden; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #080a0c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader-bar-bg { width: 200px; height: 4px; background: #1a1d23; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .loader-bar-fill { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }

        .header { display: flex; justify-content: space-around; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; }
        .stat-box { background: var(--glass); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 12px; min-width: 90px; }
        .stat-value { color: var(--gold); font-weight: 800; font-size: 13px; }

        .tab-content { display: none; padding: 20px; padding-bottom: 120px; }
        .active-tab { display: block; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .main-balance { font-size: 38px; margin: 20px 0; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; border: 2px solid var(--gold); }

        .coin-btn { width: 200px; height: 200px; border-radius: 50%; border: 8px solid #1a1d23; cursor: pointer; transition: 0.1s; }
        .coin-btn:active { transform: scale(0.92); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .card { background: linear-gradient(145deg, #1a0000, #080a0c); border: 1px solid var(--glass-border); padding: 12px; border-radius: 15px; text-align: left; }
        .locked-card { opacity: 0.5; filter: grayscale(1); }
        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 900; cursor: pointer; margin-top: 8px; font-size: 11px; }

        /* Referral & Leaderboard Style */
        .ref-box { background: var(--glass); border: 1px solid var(--glass-border); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .leaderboard-list { background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; margin-top: 15px; }
        .lb-item { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid var(--glass-border); font-size: 14px; }
        .lb-item:nth-child(1) { color: var(--gold); background: rgba(243, 186, 47, 0.1); }
        
        .invite-btn { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; }

        .footer { position: fixed; bottom: 15px; left: 5%; width: 90%; background: rgba(18, 22, 28, 0.98); border: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 12px 0; border-radius: 22px; z-index: 1000; backdrop-filter: blur(10px); }
        .nav-item { font-size: 10px; color: #666; cursor: pointer; text-align: center; font-weight: bold; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <div id="loader">
        <h2 style="color:var(--gold);">PISTO MINER V2</h2>
        <div class="loader-bar-bg"><div id="loader-fill" class="loader-bar-fill"></div></div>
    </div>

    <div class="header">
        <div class="stat-box"><span>PROFIT/HR</span><br><span id="pph-val" class="stat-value">0</span></div>
        <div class="stat-box"><span>ADS</span><br><span id="ads-count" class="stat-value">0</span></div>
    </div>

    <div id="tab-home" class="tab-content active-tab">
        <div class="main-balance"><img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png"><span id="balance">0</span></div>
        <img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png" class="coin-btn" onclick="mine(event)">
        <p style="font-weight:900;"><span style="color:var(--gold)">PISTO</span> <span style="color:var(--green)">POWERED BY</span> <span style="color:var(--red)">BD 🇧🇩</span></p>
        <button onclick="watchFixedAd()" style="background:var(--red); color:white; border:none; padding:15px; border-radius:12px; width:85%; font-weight:900; cursor:pointer;">📺 WATCH AD (+2,000)</button>
    </div>

    <div id="tab-mine" class="tab-content">
        <h3 style="text-align:left; color:var(--gold);">⛏️ MINING RIGS</h3>
        <div id="shop-container" class="grid"></div>
    </div>

    <div id="tab-ref" class="tab-content">
        <div class="ref-box">
            <h3 style="margin:0; color:var(--gold);">INVITE FRIENDS</h3>
            <p style="font-size:12px;">Get 50,000 Coins per invite!</p>
            <button class="invite-btn" onclick="copyRefLink()">🔗 SHARE INVITE LINK</button>
        </div>

        <h3 style="text-align:left; color:var(--gold); margin-bottom:10px;">🏆 TOP REFERRERS</h3>
        <div id="leaderboard" class="leaderboard-list">
            <div class="lb-item"><span>Loading Rankings...</span></div>
        </div>
    </div>

    <div id="tab-withdraw" class="tab-content">
        <div style="border:1px dashed var(--gold); padding:20px; border-radius:20px; background:#111;">
            <h2 style="color:var(--gold); margin:0;">CASH OUT</h2>
            <p style="color:var(--red); font-weight:bold; margin:5px 0;">LAUNCH: 16 DEC 2028</p>
            <small style="color:#666;">Snapshot Phase: Q3 2027</small>
        </div>
        
        <h3 style="text-align:left; color:var(--gold); margin-top:25px;">🎁 TASKS</h3>
        <div style="background:var(--glass); padding:15px; border-radius:15px; border:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center;">
            <div><b>Join Telegram</b><br><small style="color:var(--gold);">+10,000 Coins</small></div>
            <button id="tg-btn" style="background:var(--green); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;" onclick="handleTgTask()">JOIN</button>
        </div>
    </div>

    <div class="footer">
        <div class="nav-item active" onclick="showTab('tab-home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="showTab('tab-mine', this)">⛏️<br>Mine</div>
        <div class="nav-item" onclick="showTab('tab-ref', this)">🏆<br>Rank</div>
        <div class="nav-item" onclick="showTab('tab-withdraw', this)">💰<br>Cash</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTpsebnsHvl9RI9hjkA3VnRY9-NX0ESo8",
            authDomain: "pisto-f4f26.firebaseapp.com",
            projectId: "pisto-f4f26",
            storageBucket: "pisto-f4f26.firebasestorage.app",
            messagingSenderId: "345148284758",
            appId: "1:345148284758:web:fc6e1174cb2022842400f7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, pph = 0, ads = 0;
        const uid = (tg.initDataUnsafe.user?.id || "pisto_user").toString();
        const uname = tg.initDataUnsafe.user?.first_name || "Anonymous";
        const uRef = doc(db, "users", uid);
        const refLink = `https://t.me/PistoTap_bot?start=${uid}`;

        const nodes = Array.from({length: 15}, (_, i) => ({
            id: i+1, name: `Industrial Node V${i+1}`, price: (i+1)*30000, profit: (i+1)*1500, ads: i*6
        }));

        async function init() {
            let p = 0; const l = setInterval(() => { p+=25; document.getElementById('loader-fill').style.width=p+'%'; if(p>=100){clearInterval(l); document.getElementById('loader').style.display='none';}}, 150);
            
            const s = await getDoc(uRef);
            if(s.exists()){
                const d = s.data(); bal = d.balance || 0; pph = d.pph || 0; ads = d.ads || 0;
            } else {
                const urlParams = new URLSearchParams(window.location.search);
                const inviter = urlParams.get('start');
                if(inviter && inviter !== uid) {
                    await updateDoc(doc(db, "users", inviter), { balance: increment(50000), refCount: increment(1) });
                }
                await setDoc(uRef, { balance: 1000, pph: 0, ads: 0, refCount: 0, name: uname });
            }
            render(); genShop(); loops(); loadLeaderboard();
        }

        async function loadLeaderboard() {
            const q = query(collection(db, "users"), orderBy("refCount", "desc"), limit(10));
            const snap = await getDocs(q);
            let h = ""; let i = 1;
            snap.forEach(d => {
                const u = d.data();
                h += `<div class="lb-item"><span>#${i} ${u.name || 'User'}</span><b>${u.refCount || 0} Refs</b></div>`;
                i++;
            });
            document.getElementById('leaderboard').innerHTML = h || '<div class="lb-item">No referrals yet</div>';
        }

        window.copyRefLink = () => {
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("⛏️ Join Pisto Miner and get 50,000 coins bonus! Limited time.")}`;
            tg.openTelegramLink(shareUrl);
        };

        window.watchFixedAd = () => {
            show_10390421().then(async () => {
                bal += 2000; ads++; render(); genShop();
                await updateDoc(uRef, { balance: bal, ads: ads });
                confetti();
            });
        };

        window.buyNode = async (id, pr, pf, req) => {
            if(ads < req) { tg.showAlert(`Watch ${req} ads total to unlock.`); return; }
            if(bal >= pr) {
                bal -= pr; pph += pf; render(); genShop();
                await updateDoc(uRef, { balance: bal, pph: pph });
                confetti();
            } else tg.showAlert("Need more coins!");
        };

        function loops() {
            setInterval(() => { if(pph > 0) bal += (pph/3600); render(); }, 1000);
            setInterval(() => updateDoc(uRef, { balance: bal }), 20000);
            setInterval(loadLeaderboard, 60000); // Refresh LB every minute
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('pph-val').innerText = "+" + Math.floor(pph).toLocaleString();
            document.getElementById('ads-count').innerText = ads;
        }

        function genShop() {
            let h = ""; nodes.forEach(n => {
                const isLocked = ads < n.ads;
                h += `<div class="card ${isLocked ? 'locked-card' : ''}">
                    <b style="font-size:11px;">${n.name}</b><br>
                    <small style="color:var(--gold);">+${n.profit.toLocaleString()}/h</small><br>
                    <small style="font-size:9px;">Req: ${n.ads} Ads</small>
                    <button class="buy-btn" onclick="buyNode(${n.id}, ${n.price}, ${n.profit}, ${n.ads})">
                        ${isLocked ? 'LOCKED' : '💰 ' + n.price.toLocaleString()}
                    </button>
                </div>`;
            });
            document.getElementById('shop-container').innerHTML = h;
        }

        window.mine = (e) => {
            bal++; render();
            const p = document.createElement('div'); p.innerText = '+1'; p.className = 'plus-one';
            p.style.left = (e.pageX || e.touches[0].pageX) + 'px'; p.style.top = (e.pageY || e.touches[0].pageY) + 'px';
            document.body.appendChild(p); setTimeout(() => p.remove(), 700);
        };

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-tab'); el.classList.add('active');
        };

        init();
    </script>
</body>
</html>
