<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Coin - Final V2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://adsgram.ai/sdk/v1/adsgram-sdk.js"></script>
    <style>
        :root { --gold: #f3ba2f; --dark: #080a0c; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --red: #f42a41; --green: #006a4e; }
        body { background: var(--dark); color: #fff; text-align: center; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; overflow-x: hidden; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #080a0c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader-bar-bg { width: 200px; height: 4px; background: #1a1d23; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .loader-bar-fill { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }

        .header { display: flex; justify-content: space-around; padding: 15px; background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; }
        .stat-box { background: var(--glass); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 12px; min-width: 90px; }
        .stat-value { color: var(--gold); font-weight: 800; font-size: 13px; }

        .tab-content { display: none; padding: 20px; padding-bottom: 120px; }
        .active-tab { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .main-balance { font-size: 38px; margin: 20px 0; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; border: 2px solid var(--gold); }

        .coin-btn { width: 210px; height: 210px; border-radius: 50%; border: 10px solid #1a1d23; cursor: pointer; transition: 0.1s; }
        .coin-btn:active { transform: scale(0.92); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .premium-card { background: linear-gradient(145deg, #7b0000, #2a0000); border: 1px solid var(--red); padding: 12px; border-radius: 15px; text-align: left; }
        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 8px; }
        
        .task-btn { background: #1a1d23; color: #fff; border: 1px solid var(--glass-border); padding: 15px; width: 90%; border-radius: 15px; margin: 10px auto; display: flex; justify-content: space-between; align-items: center; }
        .claim-btn { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .footer { position: fixed; bottom: 15px; left: 5%; width: 90%; background: rgba(18, 22, 28, 0.95); border: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 12px 0; border-radius: 20px; backdrop-filter: blur(20px); z-index: 1000; }
        .nav-item { font-size: 10px; color: #666; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--gold); }

        .plus-one { position: absolute; color: var(--gold); font-size: 26px; font-weight: 900; animation: floatUp 0.8s forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

    <div id="loader">
        <img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png" style="width:100px; border-radius:50%; border:2px solid var(--gold);">
        <h2 style="color:var(--gold); margin-top:15px;">PISTO MINER V2</h2>
        <div class="loader-bar-bg"><div id="loader-fill" class="loader-bar-fill"></div></div>
    </div>

    <div class="header">
        <div class="stat-box"><span>PROFIT/HR</span><br><span id="pph-val" class="stat-value">0</span></div>
        <div class="stat-box"><span>ADS</span><br><span id="ads-count" class="stat-value">0</span></div>
    </div>

    <div id="tab-home" class="tab-content active-tab">
        <div class="main-balance"><img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png"><span id="balance">0</span></div>
        <img src="https://i.ibb.co.com/bj9kTWJ5/Chat-GPT-Image-Jan-1-2026-01-45-44-PM.png" class="coin-btn" onclick="mine(event)">
        <p style="color:#006a4e; font-weight:900; margin-top:15px;">POWERED BY BANGLADESH 🇧🇩</p>
        
        <div style="width: 85%; margin: 25px auto;">
            <div style="display:flex; justify-content: space-between; font-size: 11px; margin-bottom:5px;"><span>⚡ Energy</span><span><span id="energy">1000</span>/1000</span></div>
            <div style="width:100%; height:8px; background: #1a1d23; border-radius: 10px;"><div id="energy-bar" style="width:100%; height:100%; background: var(--gold);"></div></div>
        </div>
    </div>

    <div id="tab-mine" class="tab-content">
        <h3 style="text-align:left; color:var(--red);">⛏️ RED NODES</h3>
        <div id="shop-container" class="grid"></div>
    </div>

    <div id="tab-tasks" class="tab-content">
        <h3 style="text-align:left; color:var(--gold);">📋 TASK LIST</h3>
        
        <div class="task-btn">
            <div><b>📺 Video Reward</b><br><small style="color:var(--gold);">+5,000 Coins</small></div>
            <button class="claim-btn" onclick="showAd()">START</button>
        </div>

        <div class="task-btn">
            <div><b>📢 Join Channel</b><br><small style="color:var(--gold);">+10,000 Coins</small></div>
            <button id="t1" class="claim-btn" onclick="doTask('t1', 10000, 'https://t.me/PistoTap_bot')">JOIN</button>
        </div>
    </div>

    <div class="footer">
        <div class="nav-item active" onclick="showTab('tab-home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="showTab('tab-mine', this)">⛏️<br>Mine</div>
        <div class="nav-item" onclick="showTab('tab-tasks', this)">📋<br>Tasks</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTpsebnsHvl9RI9hjkA3VnRY9-NX0ESo8",
            authDomain: "pisto-f4f26.firebaseapp.com",
            projectId: "pisto-f4f26",
            storageBucket: "pisto-f4f26.firebasestorage.app",
            messagingSenderId: "345148284758",
            appId: "1:345148284758:web:fc6e1174cb2022842400f7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, nrg = 1000, pph = 0, ads = 0, purchased = [];
        const uid = (tg.initDataUnsafe.user?.id || "user_test").toString();
        const uRef = doc(db, "users", uid);

        const nodes = [
            { id: "m1", name: "Red Node I", price: 25000, profit: 800 },
            { id: "m2", name: "Red Node II", price: 100000, profit: 4500 },
            { id: "m3", name: "Red Node III", price: 500000, profit: 25000 }
        ];

        async function init() {
            let p = 0; const l = setInterval(() => { p+=20; document.getElementById('loader-fill').style.width=p+'%'; if(p>=100){clearInterval(l); document.getElementById('loader').style.display='none';}}, 150);

            const s = await getDoc(uRef);
            if(s.exists()){
                const d = s.data();
                bal = d.balance || 0; nrg = d.energy || 1000;
                pph = d.pph || 0; ads = d.ads || 0; purchased = d.purchased || [];
            } else { await setDoc(uRef, { balance: 0, energy: 1000, pph: 0, ads: 0 }); }
            render(); genShop(); loops();
        }

        window.showAd = async () => {
            const controller = window.Adsgram.init({ blockId: "20421" });
            try {
                const res = await controller.show();
                if (res.done) {
                    bal += 5000; ads++; render();
                    await updateDoc(uRef, { balance: bal, ads: ads });
                    confetti(); tg.showAlert("Success: +5,000 Coins!");
                }
            } catch (e) { tg.showAlert("Ad not ready!"); }
        };

        window.doTask = (id, reward, link) => {
            window.open(link, '_blank');
            const b = document.getElementById(id);
            b.innerText = "WAIT...";
            setTimeout(async () => {
                bal += reward; render();
                await updateDoc(uRef, { balance: bal });
                b.innerText = "DONE"; b.disabled = true;
                confetti();
            }, 5000);
        };

        window.buyNode = async (id, pr, pf) => {
            if(bal >= pr) {
                bal -= pr; pph += pf; purchased.push(id);
                render(); genShop();
                await updateDoc(uRef, { balance: bal, pph: pph, purchased: purchased });
                confetti();
            } else tg.showAlert("Need more coins!");
        };

        function loops() {
            setInterval(() => { if(pph > 0) bal += (pph/3600); if(nrg < 1000) nrg++; render(); }, 1000);
            setInterval(() => updateDoc(uRef, { balance: bal, energy: nrg }), 20000);
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('pph-val').innerText = "+" + Math.floor(pph).toLocaleString();
            document.getElementById('energy').innerText = nrg;
            document.getElementById('energy-bar').style.width = (nrg/10) + "%";
            document.getElementById('ads-count').innerText = ads;
        }

        function genShop() {
            let h = ""; nodes.forEach(n => {
                h += `<div class="premium-card"><b>${n.name}</b><br><small>+${n.profit}/h</small>
                <button class="buy-btn" onclick="buyNode('${n.id}', ${n.price}, ${n.profit})">💰 ${n.price.toLocaleString()}</button></div>`;
            });
            document.getElementById('shop-container').innerHTML = h;
        }

        window.mine = (e) => {
            if(nrg < 1) return; bal++; nrg--; render();
            const p = document.createElement('div'); p.innerText = '+1'; p.className = 'plus-one';
            p.style.left = e.pageX+'px'; p.style.top = e.pageY+'px';
            document.body.appendChild(p); setTimeout(() => p.remove(), 700);
        };

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-tab'); el.classList.add('active');
        };

        init();
    </script>
</body>
</html>
