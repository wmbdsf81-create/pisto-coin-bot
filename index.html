<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pisto Coin - Pro Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0e11; color: white; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; user-select: none; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #1c1f24; border-bottom: 2px solid #f3ba2f; position: sticky; top: 0; z-index: 100; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-value { color: #f3ba2f; font-weight: bold; font-size: 16px; }
        
        .tab-content { display: none; padding: 20px; height: 75vh; overflow-y: auto; }
        .active-tab { display: block; }

        .main-balance { font-size: 40px; margin: 20px 0; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .main-balance img { width: 35px; margin-right: 10px; }

        .coin-btn { width: 220px; height: 220px; border-radius: 50%; border: 10px solid #2c2f35; cursor: pointer; transition: transform 0.05s; }
        .coin-btn:active { transform: scale(0.95); }

        /* কার্ড ডিজাইন */
        .card-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .card { background: #1c1f24; padding: 15px; border-radius: 15px; border: 1px solid #333; text-align: left; }
        .card h4 { margin: 0; font-size: 14px; color: #fff; }
        .card p { margin: 5px 0; font-size: 12px; color: #888; }
        .buy-btn { background: #f3ba2f; color: #000; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .buy-btn:disabled { background: #555; cursor: not-allowed; }

        .footer { position: fixed; bottom: 0; width: 100%; background: #1c1f24; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav-item { font-size: 11px; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #f3ba2f; }
        .nav-icon { font-size: 20px; margin-bottom: 3px; }

        .plus-one { position: absolute; color: #f3ba2f; font-size: 26px; font-weight: bold; animation: floatUp 0.7s forwards; pointer-events: none; z-index: 1000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

    <div class="header">
        <div><span class="stat-label">Profit per hour</span><br><span id="pph-val" class="stat-value">+0</span></div>
        <div><span class="stat-label">Rank</span><br><span class="stat-value" style="color:white">Bronze</span></div>
    </div>

    <div id="exchange-tab" class="tab-content active-tab">
        <div class="main-balance"><img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg"> <span id="balance">0</span></div>
        <div style="position: relative; display: inline-block;">
            <img src="https://i.ibb.co/X7f3nTB/pisto-coin.jpg" class="coin-btn" onclick="mine(event)">
        </div>
        <div style="margin-top: 30px;">
            <div style="font-weight: bold;">⚡ <span id="energy">1000</span> / 1000</div>
            <div style="width: 80%; height: 10px; background: #333; border-radius: 10px; margin: 10px auto; overflow: hidden;">
                <div id="energy-bar" style="width: 100%; height: 100%; background: #f3ba2f; transition: width 0.2s;"></div>
            </div>
        </div>
    </div>

    <div id="mine-tab" class="tab-content">
        <h3>Mining Cards</h3>
        <div class="card-container">
            <div class="card">
                <h4>Hamster Bot</h4>
                <p>Profit: +50/hr</p>
                <p>Price: 🪙 500</p>
                <button class="buy-btn" onclick="buyCard(500, 50)">Buy</button>
            </div>
            <div class="card">
                <h4>Pisto Team</h4>
                <p>Profit: +120/hr</p>
                <p>Price: 🪙 1,200</p>
                <button class="buy-btn" onclick="buyCard(1200, 120)">Buy</button>
            </div>
            <div class="card">
                <h4>Mining Farm</h4>
                <p>Profit: +500/hr</p>
                <p>Price: 🪙 5,000</p>
                <button class="buy-btn" onclick="buyCard(5000, 500)">Buy</button>
            </div>
            <div class="card">
                <h4>CEO Office</h4>
                <p>Profit: +2,000/hr</p>
                <p>Price: 🪙 20,000</p>
                <button class="buy-btn" onclick="buyCard(20000, 2000)">Buy</button>
            </div>
        </div>
    </div>

    <div id="friends-tab" class="tab-content">
        <h3>Invite Friends</h3>
        <p>Coming Soon!</p>
    </div>

    <div class="footer">
        <div class="nav-item active" onclick="showTab('exchange-tab', this)"><span class="nav-icon">🏠</span>Exchange</div>
        <div class="nav-item" onclick="showTab('mine-tab', this)"><span class="nav-icon">⛏️</span>Mine</div>
        <div class="nav-item" onclick="showTab('friends-tab', this)"><span class="nav-icon">👥</span>Friends</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0kFdBKIQIisg3dWBWczSRVIzdv7fe9I",
            authDomain: "pisto-d65eb.firebaseapp.com",
            projectId: "pisto-d65eb",
            storageBucket: "pisto-d65eb.firebasestorage.app",
            messagingSenderId: "690904339160",
            appId: "1:690904339160:web:eaa9b217bba7244ff6bdad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bal = 0, nrg = 1000, pph = 0;
        const userId = (tg.initDataUnsafe.user?.id || "test_user").toString();
        const userRef = doc(db, "users", userId);

        async function loadData() {
            const snap = await getDoc(userRef);
            if(snap.exists()){
                bal = snap.data().balance || 0;
                nrg = snap.data().energy || 1000;
                pph = snap.data().pph || 0;
            } else {
                await setDoc(userRef, { balance: 0, energy: 1000, pph: 0 });
            }
            render();
        }

        function render() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('energy').innerText = nrg;
            document.getElementById('pph-val').innerText = "+" + pph;
            document.getElementById('energy-bar').style.width = (nrg/10) + "%";
        }

        window.showTab = (tabId, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active-tab');
            el.classList.add('active');
        }

        window.mine = (e) => {
            if(nrg <= 0) return;
            bal++; nrg--;
            render();
            const p = document.createElement('div');
            p.innerText = '+1'; p.className = 'plus-one';
            p.style.left = e.pageX + 'px'; p.style.top = e.pageY + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 700);
            updateDoc(userRef, { balance: bal, energy: nrg });
        };

        window.buyCard = async (price, profit) => {
            if(bal >= price) {
                bal -= price;
                pph += profit;
                render();
                await updateDoc(userRef, { balance: bal, pph: pph });
                alert("Card Purchased! Your profit increased.");
            } else {
                alert("Not enough coins!");
           }
        };

        // Auto profit and energy
        setInterval(() => {
            if(pph > 0) { bal += (pph / 3600); }
            if(nrg < 1000) { nrg++; }
            render();
        }, 1000);

        loadData();
    </script>
</body>
</html>
